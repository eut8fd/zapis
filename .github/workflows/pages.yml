name: Deploy Mini App

# Публикует папку webapp/ на GitHub Pages при каждом пуше в main.
# Приложение полностью статическое, поэтому сборка не нужна.

# Фильтра по путям здесь нет намеренно. Он экономил несколько секунд
# на коммитах в документацию, но создавал тупик: пока в webapp/ ничего
# не менялось, сайт нельзя было перевыпустить — ни после включения Pages,
# ни после упавшей сборки. Работа длится полминуты, экономить на ней нечего.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Приложение грузится браузером без сборки: один синтаксически битый
      # файл рушит его целиком, и узнать об этом до публикации больше негде.
      #
      # Проверяем настоящим разбором ES-модуля: копия с расширением .mjs,
      # дальше `node --check`. Так Node парсит файл как модуль и не выполняет
      # его — иначе код сразу упёрся бы в document и localStorage, которых
      # на сервере нет.
      #
      # Прошлая версия вырезала строки с import/export регуляркой и скармливала
      # остаток в new Function. На многострочных импортах от них оставались
      # хвосты вроде «} from '../store.js';», и проверка валилась на здоровом
      # коде.
      - name: Синтаксис модулей
        run: |
          mkdir -p /tmp/syn
          bad=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            cp "$f" /tmp/syn/check.mjs
            if ! node --check /tmp/syn/check.mjs 2>/tmp/syn/err; then
              echo "✗ $f"
              sed 's/^/    /' /tmp/syn/err
              bad=$((bad + 1))
            fi
          done < <(find webapp/js -name '*.js' | sort)
          echo "проверено файлов: $total | с ошибками: $bad"
          [ "$bad" -eq 0 ]
        shell: bash

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Mini App

# Публикует папку webapp/ на GitHub Pages при каждом пуше в main и
# прогоняет проверки сервера и бота. Приложение полностью статическое,
# поэтому сборка не нужна.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Приложение грузится браузером без сборки: один синтаксически битый
      # файл рушит его целиком, и узнать об этом до публикации больше негде.
      # Копия с расширением .mjs и `node --check` разбирает файл как модуль,
      # не выполняя его.
      - name: Синтаксис модулей
        run: |
          mkdir -p /tmp/syn
          bad=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            cp "$f" /tmp/syn/check.mjs
            if ! node --check /tmp/syn/check.mjs 2>/tmp/syn/err; then
              echo "✗ $f"
              sed 's/^/    /' /tmp/syn/err
              bad=$((bad + 1))
            fi
          done < <(find webapp/js -name '*.js' | sort)
          echo "проверено файлов: $total | с ошибками: $bad"
          [ "$bad" -eq 0 ]
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Сервер и бот — чистая стандартная библиотека, ставить ничего не нужно.
      - name: Тесты сервера
        run: python -m unittest discover -s server/tests -v

      - name: Тесты бота
        run: python -m unittest discover -s bot/tests -v

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
